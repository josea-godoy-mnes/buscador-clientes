<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Clientes</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #f0f6ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Animación suave */
    tr {
      transition: background-color 0.2s ease;
    }
    tr:hover {
      background-color: #eaf3ff;
    }
  </style>
</head>

<body class="p-4">

  <!-- LOGIN -->
  <div id="login" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg mt-20">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-4">Acceso de Supervisores</h2>
    <input id="user" type="text" placeholder="Usuario" class="w-full mb-3 p-3 border rounded-lg">
    <input id="pass" type="password" placeholder="Contraseña" class="w-full mb-4 p-3 border rounded-lg">
    <button id="btnLogin" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Ingresar</button>
    <p id="error" class="text-red-500 text-center mt-3 hidden">Usuario o contraseña incorrectos</p>
  </div>

  <!-- CONTENIDO (oculto hasta que haga login) -->
  <div id="contenido" class="hidden">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-lg p-6">
      <h1 class="text-2xl md:text-3xl font-bold text-center text-blue-700 mb-6">🔍 Buscador de Clientes</h1>

      <input type="text" id="search" placeholder="Buscar cliente, código, ruta o vendedor..."
        class="w-full p-3 mb-5 border border-blue-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <div class="overflow-x-auto">
        <table class="min-w-full border border-blue-200">
          <thead class="bg-blue-100 text-blue-900">
            <tr>
              <th class="p-2 border">Esquema</th>
              <th class="p-2 border">Cod. Cliente</th>
              <th class="p-2 border">Cliente</th>
              <th class="p-2 border">Categoría</th>
              <th class="p-2 border">Supervisor</th>
              <th class="p-2 border">Vendedor</th>
              <th class="p-2 border">Ruta</th>
            </tr>
          </thead>
          <tbody id="tabla-datos" class="text-sm md:text-base"></tbody>
        </table>
      </div>
      <p id="status" class="text-center text-gray-500 mt-4">Cargando datos...</p>
    </div>
  </div>

  <script>
    // URL de tu hoja de usuarios:
    const urlUsuarios = "https://docs.google.com/spreadsheets/d/1126uV8-6yBGhPHsiTXfNtNx9VbiKWQuc/gviz/tq?tqx=out:json&sheet=usuarios";
    const urlDatos = "https://docs.google.com/spreadsheets/d/1126uV8-6yBGhPHsiTXfNtNx9VbiKWQuc/gviz/tq?tqx=out:json&gid=1339672665";

    async function validarLogin() {
      try {
        const res = await fetch(urlUsuarios);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const usuarios = json.table.rows.map(r => ({
          user: r.c[0]?.v || "",
          pass: r.c[1]?.v || ""
        }));

        const userInput = document.getElementById("user").value.trim();
        const passInput = document.getElementById("pass").value.trim();

        const encontrado = usuarios.find(u => u.user === userInput && u.pass === passInput);

        if (encontrado) {
          document.getElementById("login").style.display = "none";
          document.getElementById("contenido").classList.remove("hidden");
          cargarDatos();
        } else {
          document.getElementById("error").classList.remove("hidden");
        }
      } catch (err) {
        alert("Error al verificar usuario.");
        console.error(err);
      }
    }

    async function cargarDatos() {
      try {
        const res = await fetch(urlDatos);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const datos = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
        mostrarTabla(datos);
        document.getElementById("status").textContent = "";
      } catch (error) {
        document.getElementById("status").textContent = "⚠️ Error al cargar los datos.";
        console.error(error);
      }
    }

    function mostrarTabla(datos) {
      const tbody = document.getElementById("tabla-datos");
      tbody.innerHTML = "";
      datos.forEach(fila => {
        const tr = document.createElement("tr");
        tr.innerHTML = fila.map(c => `<td class='border p-2'>${c}</td>`).join("");
        tbody.appendChild(tr);
      });
    }

    document.getElementById("btnLogin").addEventListener("click", validarLogin);

    document.getElementById("search").addEventListener("input", function (e) {
      const filtro = e.target.value.toLowerCase();
      const filas = document.querySelectorAll("#tabla-datos tr");
      filas.forEach(fila => {
        fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? "" : "none";
      });
    });
  </script>

</body>
</html>
